<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Duplicated verbatim on every page, not extracted to a shared file
         on purpose: it must run synchronously before first paint (a
         module import would defer past that point and bring back the
         FOUC this exists to prevent). See design-system.html and
         main.ts's theme-toggle code for the rest of this mechanism. -->
    <script>
      (function () {
        var stored = localStorage.getItem('cdz-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cadenza — UX Engineer Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <nav>
        <cdz-link href="./design-system.html">Ver el design system →</cdz-link>
        <!-- Solo visible en desarrollo local (ver main.ts): @kdenza/gallery
             es un paquete privado, corre en su propio servidor de Vite
             (puerto 5174) y no se buildea ni se despliega junto al sitio
             todavía -- ver ADR-0004. -->
        <cdz-link id="gallery-link" href="http://localhost:5174" hidden
          >Ver la galería de componentes →</cdz-link
        >
      </nav>
      <h1>Cadenza</h1>
      <p>
        Design system + portafolio de UX Engineering. Este sitio es su propio
        caso de estudio: tokens → componentes → sitio, de punta a punta.
      </p>
      <div class="button-row">
        <cdz-button id="cta-primary">Contactarme</cdz-button>
        <cdz-button disabled>No disponible</cdz-button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
