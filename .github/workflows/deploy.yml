name: Deploy site

on:
  push:
    branches: [main]
  # Allows launching it by hand from the Actions tab without having to make
  # an empty commit.
  workflow_dispatch:

# The minimum permissions `actions/deploy-pages` asks for.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and without cancelling the one already in
# progress: cutting a deploy halfway leaves the site in an indeterminate
# state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build the site
        # NODE_ENV=production is what switches on `base: '/cadenza/'` in
        # vite.config.ts. GitHub Pages serves a project site from /<repo>/,
        # not from the domain root; without that prefix every asset would
        # 404 even if the build were correct.
        env:
          NODE_ENV: production
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # If Pages is not configured in "GitHub Actions" mode yet, this
          # action fails with an opaque 404 from the API ("Get Pages site
          # failed"). With enablement it tries to enable Pages itself, so
          # the order between changing the setting and launching the
          # workflow stops mattering. If the failure were about the plan or
          # permissions, the error it returns is explicit about that rather
          # than a Not Found.
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          # The site only. @kdenza/gallery is private and still is not
          # deployed -- see ADR-0004.
          path: packages/site/dist

  deploy:
    # Nothing is published if CI does not pass: the CI workflow runs on the
    # same push, and this job waits for the site to build here too.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
