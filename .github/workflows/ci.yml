name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an earlier run on the same branch when a new push arrives: nobody
# cares about the old result any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Must match the Node used in the development environment (see the
          # "Environment constraints" section of CLAUDE.md).
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # tokens -> components -> analyze -> site. Chained on purpose: if the
        # tokens do not compile, the components should not either.
        run: npm run build

      - name: Locate Chrome
        # @web/test-runner needs a Chrome. ubuntu-latest already ships one, but
        # the path is resolved rather than hardcoded: if a future image moves
        # it, this fails here with a clear message instead of breaking inside
        # the test runner with an error that carries no context.
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if path=$(command -v "$bin"); then
              echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
              echo "Using $bin at $path"
              exit 0
            fi
          done
          echo "::error::No Chrome binary was found on the runner."
          exit 1

      - name: Tests
        # The --no-sandbox flags live in web-test-runner.config.js, which
        # already needed them for containerised environments.
        run: npm test

      - name: Security audit
        # The reason this workflow exists, more than the build or the tests.
        # ADR-0023: the dependency debt grew from 2 to 9 advisories without
        # anyone noticing, because `npm audit` only ran when someone
        # remembered to run it. Here it always runs.
        run: npm audit --audit-level=high
